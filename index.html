<!DOCTYPE html>
 
<html lang="en">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Anime Character Finder</title>
    <link rel="stylesheet" href="style.css" >
</head>
 
 
<body>
    <header>
        <h1>🍥 Simple Anime Character Finder</h1>
        <p> A website powered by a REST API </p>
    </header>
    <main>
 
        <!-- SEARCH -->
        <section class="search">
            <input type="text" id="searchInput" placeholder="Search for an Anime Character...">
            <button onclick="searchCharacters()"> Search </button>
            <button class="secondary" onclick="loadCharacters()"> Show All </button>
 
        </section>
 
        <section>
            <h2>Characters</h2>
            <div id="characterList" class="character-list">
                Loading characters...
            </div>
        </section>
    </main>
 
    <footer>
        <p> Data provided by the Simple Anime Character API </p>
    </footer>
    <script src="app.js"></script>
</body>
</html>
